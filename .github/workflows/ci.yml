name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Note: do NOT set `RUSTFLAGS` at workflow scope — the env var fully
  # overrides `rustflags` in any `.cargo/config.toml` the workspace
  # ships. We enforce `-D warnings` through clippy's own `-- -D warnings`
  # and per-job `RUSTDOCFLAGS` for rustdoc.

jobs:
  host:
    name: Host (fmt, clippy, test, doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (workspace, all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --workspace --all-features

      - name: doc
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  embedded-thumbv7em:
    name: Build for thumbv7em-none-eabihf (Cortex-M4F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: build workspace lib
        run: cargo build --workspace --lib --target thumbv7em-none-eabihf
      - name: build workspace lib (defmt)
        run: cargo build --workspace --lib --target thumbv7em-none-eabihf --features defmt
      - name: clippy workspace lib
        run: cargo clippy --workspace --lib --target thumbv7em-none-eabihf -- -D warnings

  embedded-riscv32:
    name: Build for riscv32imc-unknown-none-elf (ESP32-C/H, RP2350)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: build workspace lib
        run: cargo build --workspace --lib --target riscv32imc-unknown-none-elf
      - name: build workspace lib (defmt)
        run: cargo build --workspace --lib --target riscv32imc-unknown-none-elf --features defmt
      - name: clippy workspace lib
        run: cargo clippy --workspace --lib --target riscv32imc-unknown-none-elf -- -D warnings

  msrv:
    name: MSRV 1.75
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.75.0
      - uses: Swatinem/rust-cache@v2
      - name: build workspace lib on MSRV
        run: cargo build --workspace --lib
      - name: build workspace lib on MSRV (defmt)
        run: cargo build --workspace --lib --features defmt
