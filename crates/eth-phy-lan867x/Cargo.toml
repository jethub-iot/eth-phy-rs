[package]
name          = "eth-phy-lan867x"
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.75"
authors       = ["Viacheslav Bocharov <v@baodeep.com>", "JetHome (r)"]
license       = "GPL-2.0-or-later OR Apache-2.0"
description   = "LAN8670/8671/8672 10BASE-T1S Ethernet PHY driver for no_std over MDIO"
repository    = "https://github.com/jethub-iot/eth-phy-rs"
documentation = "https://docs.rs/eth-phy-lan867x"
readme        = "README.md"
keywords      = ["embedded", "no-std", "phy", "t1s", "eth-t1s"]
categories    = ["embedded", "no-std", "hardware-support"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
eth-mdio-phy = { version = "0.1.1", path = "../eth-mdio-phy" }
embedded-hal = "1.0"
defmt        = { version = "0.3", optional = true }

[features]
default = []
defmt   = ["dep:defmt", "eth-mdio-phy/defmt"]
