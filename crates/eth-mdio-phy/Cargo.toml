[package]
name          = "eth-mdio-phy"
version       = "0.3.0"
edition       = "2021"
rust-version  = "1.75"
authors       = ["Viacheslav Bocharov <v@baodeep.com>", "JetHome (r)"]
license       = "GPL-2.0-or-later OR Apache-2.0"
description   = "MDIO-based Ethernet PHY traits and IEEE 802.3 helpers for no_std"
repository    = "https://github.com/jethub-iot/eth-phy-rs"
documentation = "https://docs.rs/eth-mdio-phy"
readme        = "README.md"
keywords      = ["embedded", "no-std", "ethernet", "phy", "mdio"]
categories    = ["embedded", "no-std", "hardware-support"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
defmt = { version = "0.3", optional = true }

[features]
default = []
defmt   = ["dep:defmt"]
